# Every push and pull request: set up the toolchain and the emulator, then run every automated gate
# (factory/check.sh): build, the music oracle, safety, and the scenarios on the host simulator and
# on the real firmware in the emulator. The firmware packages and the screens go up as artifacts
# for a person to look at and, on a real FM-1, to try.
name: Factory

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: System packages for the emulator
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxkbcommon-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the JieLi toolchain and SDK files
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ hashFiles('tools/setup.sh') }}
      - name: Cache the emulator build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            third_party/fm1-emu/target
          key: emu-${{ hashFiles('.gitmodules', 'factory/patches/*.patch') }}-${{ github.sha }}
          restore-keys: emu-${{ hashFiles('.gitmodules', 'factory/patches/*.patch') }}-
      - name: Setup
        run: tools/setup.sh
      - name: Gates
        run: factory/check.sh
      - name: Replay the previously reviewed Clean Punch firmware
        if: ${{ always() && !cancelled() && (github.head_ref == 'clean-punch' || github.ref_name == 'clean-punch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          replay="$RUNNER_TEMP/clean-punch-replay"
          gh run download --repo "$GITHUB_REPOSITORY" 45501602741 --name firmware-and-screens --dir "$replay"
          old="$replay/build/companion/companion.fwsc"
          echo "39515058014ceaea31a2da41588df9ea3171063dbb50fafb1fd21a9abf51cfc4  $old" | sha256sum --check
          current="$PWD/build/companion/companion.fwsc"
          cp "$current" "$replay/current.fwsc"
          trap 'cp "$replay/current.fwsc" "$current"' EXIT
          cp "$old" "$current"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from PIL import Image, ImageChops
          from factory.run import run_emu

          reviewed = {
              "companion_sound_browser": (1300, 1900, 2500, 5000),
              "companion_coralflower_va": (2860,),
              "companion_clean_punch": (1700,),
          }
          replay = Path(os.environ["RUNNER_TEMP"]) / "clean-punch-replay"
          evidence = Path("work/clean-punch-review")
          evidence.mkdir(parents=True, exist_ok=True)
          for name, times in reviewed.items():
              scenario = json.loads(Path(f"factory/scenarios/{name}.json").read_text())
              result = run_emu(scenario, replay / name)
              for at in times:
                  original = Image.fromarray(result["lcd"](at).astype("uint8")).convert("RGB")
                  original.save(evidence / f"{name}_{at}_previous.png")
                  with Image.open(f"work/factory/{name}/screen_{at}_device.png") as current:
                      identical = ImageChops.difference(original, current.convert("RGB")).getbbox() is None
                  print(f"{name} {at}: reviewed firmware vs current: {'identical' if identical else 'different'}")
          PY
      - name: Upload reviewed Clean Punch evidence
        if: ${{ always() && !cancelled() && (github.head_ref == 'clean-punch' || github.ref_name == 'clean-punch') }}
        uses: actions/upload-artifact@v4
        with:
          name: clean-punch-review-evidence
          path: work/clean-punch-review/*.png
          if-no-files-found: ignore
      - name: Firmware and screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-and-screens
          path: |
            build/*/*.fwsc
            work/factory/*/*.png
            work/factory/summary.json
          if-no-files-found: ignore
