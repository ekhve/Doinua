<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doinua preset save lab</title>
<style>
:root{color-scheme:dark;background:#1b1d24;color:#e8eaf0;font:15px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:32px auto;padding:0 16px}
h1{font-size:1.6rem;margin:0}p{max-width:52ch}
.panel{background:#23262f;border:1px solid #343846;border-radius:12px;padding:16px;display:grid;gap:14px;justify-items:center}
.screen{width:min(240px,100%);aspect-ratio:1;background:#0b1416;border:2px solid #111317;box-sizing:border-box;padding:10px;display:flex;flex-direction:column;color:#faf3f6}
.screen header{display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid #454150;padding-bottom:5px}
.screen header strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{font-size:.75rem;color:#ffb347;flex-shrink:0}
h2{font-size:1rem;margin:12px 0 6px}
ul{list-style:none;margin:0;padding:0}li{padding:3px 6px}.active{background:#46351e;color:#ffe5b8}
.hint{margin:auto 0 0;color:#b9bbc9;font-size:.76rem}
.name{font:600 1.15rem/1.4 monospace;letter-spacing:.08em;margin-top:12px}
.cursor{color:#ffb347;border-bottom:2px solid currentColor}
.keys{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
button,select{font:inherit;color:inherit;background:#303540;border:1px solid #585e70;border-radius:6px;padding:6px 9px}
button:focus-visible,select:focus-visible{outline:2px solid #ffb347}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
</style>
</head>
<body><main>
<h1>Preset save lab</h1>
<p>Choose a sound, turn K1 to change cutoff, then press SAVE. This prototype stores presets in the page until it reloads.</p>
<div class="panel">
  <label class="actions">Current sound <select id="preset"></select></label>
  <div class="screen" aria-live="polite">
    <header><strong id="sound"></strong><span class="page" id="page"></span></header>
    <h2 id="title"></h2>
    <div id="content"></div>
    <p class="hint" id="hint"></p>
  </div>
  <div class="keys" aria-label="Panel controls">
    <button data-key="left" aria-label="Turn SELECT left">SELECT −</button>
    <button data-key="right" aria-label="Turn SELECT right">SELECT +</button>
    <button data-key="down" aria-label="Turn K1 down">K1 −</button>
    <button data-key="up" aria-label="Turn K1 up">K1 +</button>
    <button data-key="save">SAVE</button>
    <button data-key="home">HOME</button>
  </div>
</div>
</main>
<script>
"use strict";
const factory = [
  { id:"sine", kind:"Factory", name:"SINE SOLO", cutoff:100 },
  { id:"init", kind:"INIT", name:"INIT", cutoff:65 },
];
let user = [{ id:"u1", kind:"User", name:"Night Bass", cutoff:44 }];
let nextId = 2;
let sound = { ...factory[0] };
let mode = "edit", selected = 0, name = [], cursor = 0, notice = "";
const glyphs = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-";
const nameLength = 12;
const el = id => document.getElementById(id);
const input = el("preset");
const list = () => [...factory, ...user];
const menu = () => sound.kind === "User" ? ["Cancel", "Overwrite", "Save As"] : ["Cancel", "Save As"];
const text = (id, value) => { el(id).textContent = value; };
function load(id) {
  const item = list().find(preset => preset.id === id);
  if (!item) return;
  sound = { ...item };
  mode = "edit";
  notice = "";
}
function beginName() {
  name = [...sound.name.toUpperCase().slice(0, nameLength).padEnd(nameLength)];
  cursor = 0;
  mode = "name";
}
function store(asNew) {
  if (asNew) {
    const label = name.join("").trim();
    if (!label) { notice = "Enter a name"; return; }
    sound = { ...sound, id:"u" + nextId++, kind:"User", name:label };
    user = [...user, { ...sound }];
  } else {
    user = user.map(preset => preset.id === sound.id ? { ...sound } : preset);
  }
  notice = "Saved " + sound.name;
  mode = "edit";
}
function step(key) {
  const dir = key === "left" || key === "down" ? -1 : 1;
  const select = key === "left" || key === "right";
  const knob = key === "down" || key === "up";
  if (key === "home") {
    if (mode !== "edit") { mode = "edit"; notice = "Cancelled"; }
  } else if (mode === "edit") {
    if (knob) { sound.cutoff = Math.max(0, Math.min(100, sound.cutoff + 5 * dir)); notice = ""; }
    if (key === "save") { selected = 0; mode = "menu"; notice = ""; }
  } else if (mode === "menu") {
    const choices = menu();
    if (select) selected = (selected + dir + choices.length) % choices.length;
    if (key === "save") {
      const action = choices[selected];
      if (action === "Cancel") { mode = "edit"; notice = "Cancelled"; }
      if (action === "Overwrite") store(false);
      if (action === "Save As") beginName();
    }
  } else if (mode === "name") {
    if (select) cursor = (cursor + dir + nameLength) % nameLength;
    if (knob) {
      const i = glyphs.indexOf(name[cursor]);
      name[cursor] = glyphs[(i + dir + glyphs.length) % glyphs.length];
      notice = "";
    }
    if (key === "save") store(true);
  }
  draw();
}
function draw() {
  input.replaceChildren(...list().map(item => new Option(item.kind + " · " + item.name, item.id)));
  input.value = sound.id;
  input.disabled = mode !== "edit";
  text("sound", sound.name);
  text("page", mode === "edit" ? "FILTER" : "SAVE PRESET");
  const content = el("content");
  content.replaceChildren();
  if (mode === "edit") {
    text("title","Cutoff " + sound.cutoff + "%");
    text("hint",notice || "K1 edits cutoff · SAVE opens preset options");
  } else if (mode === "menu") {
    text("title",sound.kind === "User" ? "Overwrite " + sound.name + "?" : "Save a new preset?");
    const items = document.createElement("ul");
    menu().forEach((choice, index) => {
      const item = document.createElement("li");
      item.textContent = choice;
      if (index === selected) item.className = "active";
      items.append(item);
    });
    content.append(items);
    text("hint","SELECT chooses · SAVE confirms · HOME cancels");
  } else {
    text("title","Name the new preset");
    const row = document.createElement("div");
    row.className = "name";
    name.forEach((glyph, index) => {
      const item = document.createElement("span");
      item.textContent = glyph === " " ? "·" : glyph;
      if (index === cursor) item.className = "cursor";
      row.append(item);
    });
    content.append(row);
    text("hint",notice || "SELECT moves · K1 changes character · SAVE confirms");
  }
}
input.addEventListener("change", () => { load(input.value); draw(); });
document.querySelectorAll("[data-key]").forEach(key => key.addEventListener("click", () => step(key.dataset.key)));
draw();
</script>
</body>
</html>
